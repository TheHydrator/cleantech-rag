apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app
  template:
    metadata:
      labels:
        app: rag-app
    spec:
      containers:
        - name: app
          image: cleantech-rag-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
          startupProbe:           # give the app time to load PyTorch and the reranker
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24  # up to 2 minutes to start
          readinessProbe:         # can it serve? (checks the database)
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:          # is it frozen? (port open only, NOT the database)
            tcpSocket:
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: rag
spec:
  selector:
    app: rag-app
  ports:
    - port: 8000