apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: rag
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ask
            pathType: Exact
            backend:
              service:
                name: app
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: app
                port:
                  number: 8000