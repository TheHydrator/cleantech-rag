apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: rag
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: rag-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 2-31-23-140.sslip.io
      secretName: app-tls
  rules:
    - host: 2-31-23-140.sslip.io
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: app
                port:
                  number: 8000
          - path: /ask
            pathType: Exact
            backend:
              service:
                name: app
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: app
                port:
                  number: 8000