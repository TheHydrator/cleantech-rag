services:
  db:
    image: pgvector/pgvector:pg16
    shm_size: 1gb
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_pw
      POSTGRES_DB: cleantech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag_local_pw@db:5432/cleantech
      OPENAI_MAX_RETRIES: "1"
      OPENAI_TIMEOUT: "30"
    ports:
      - "8000:8000"
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest   # pin to a specific version once it works
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest   # pin to a specific version once it works
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_pw   # local only; real secrets come later
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata: