services:
  db:
    image: pgvector/pgvector:pg16
    shm_size: 1gb
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_pw
      POSTGRES_DB: cleantech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag_local_pw@db:5432/cleantech
      OPENAI_MAX_RETRIES: "1"
      OPENAI_TIMEOUT: "30"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: